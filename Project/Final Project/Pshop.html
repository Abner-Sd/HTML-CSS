<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Abner">
    <meta name="description" content="The official website for The Little Taco Shop.">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/tacofavicon.ico" type="image/x-icon">
    <title>Little Taco Shop</title>
    <script src="main.js" defer></script>
</head>

<body>

    <header class="header">
        <h1 class="header__h1">Little Taco Shop</h1>
        <nav aria-label="Main-Navigation" class="header__nav">
            <ul class="header__ul">
                <li><a href="#ourmenu">Menu</a></li>
                <li><a href="Phours.html">Hours</a></li>
                <li><a href="Pcontact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h2 class="hero__h2">Bienvenidos</h2>
        <figure>
            <img src="img/tacos_and_drink_1000x667.png" alt="Delicius tacos" title="Tacos and drinks" width="1000"
                height="667">
        </figure>
        <figcaption class="offscreen">Tacos and a Drink</figcaption>
    </section>

    <main class="main">

        <article id="ourmenu" class="main__article menu">
            <h2 class="menu__h2">Our Menu</h2>
            <section>
                <table class="menu__container">
                    <caption class="offscreen">Our Tacos</caption>
                    <thead >
                        <tr>
                            <th scope="col" class="menu__header">Tacos</th>
                            <th scope="col" class="menu__header">Quantity</th>
                            <th scope="col" class="menu__header">Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th class= "menu__item menu__cr" scope="row" rowspan="3">Crunchy</th>
                            <td class="menu__item">1</td>
                            <td class="menu__item">$1.50</td>
                        <tr>
                            <td class="menu__item">2</td>
                            <td class="menu__item">$2.50</td>
                        </tr>
                        <tr>
                            <td class="menu__item">3</td>
                            <td class="menu__item">$3.25</td>
                        </tr>
                        </tr>
                        <tr>
                            <th class= "menu__item menu__sf" scope="row" rowspan="3">Soft</th>
                            <td class="menu__item">1</td>
                            <td class="menu__item">$2.00</td>
                        </tr>
                        <tr>
                            <td class="menu__item">2</td>
                            <td class="menu__item">$3.50</td>
                        </tr>
                        <tr>
                            <td class="menu__item">3</td>
                            <td class="menu__item">$4.50</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td class="menu__item menu__cs" colspan="3">Chips & Salsa $2</td>
                        </tr>
                    </tfoot>
                </table>
            </section>
        </article>

        <p class="center"><a href="#top">Back to top</a></p>
    </main>
    <hr>
    <footer class="footer">
        <p>
            <span class="nowrap">Copyright &copy; <time id="year"></time></span> <span class="nowrap">Little Taco Shop</span>
        </p>
    </footer>
</body>

</html>
