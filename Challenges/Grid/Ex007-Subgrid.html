<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subgrid</title>
    <style>
        body {
            background-color: grey;
        }

        .wrapper {
            display: grid;
            grid-gap: 5px;
            grid-template-columns: 150px 100px 150px 100px;
            grid-template-rows: repeat(3, minmax(100px auto));
            margin: 30px;
        }

        .box {
            background-color: #444;
            color: #fff;
            border-radius: 5px;
            padding: 20px;
            font-size: 150%;
        }

        .box .box {
            background-color: #ccc;
            color: #444;
        }

        .a {
            grid-column: 1 / 3;
        }

        .b {
            grid-column: 4;
        }

        .c {
            grid-column: 1;
            grid-row: 2 / 4;
        }

        .d {
            grid-column: 2 / 5;
            grid-row: 2 / 4;
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
        }

        .e {
            grid-row: 1 / 3;
            grid-column: 1;
        }

        .f {
            grid-row: 1;
            grid-column: 2 / 4;
        }

        .g {
            grid-row: 2;
            grid-column: 3;
        }

        .container {
            display: grid;
            grid-gap: 5px;
            grid-template-columns: 150px 100px 150px 100px;
            grid-template-rows: repeat(3, minmax(100px, auto));
            padding: 20px;
            margin: 20px;
        }

        .vox {
            background-color: #444;
            color: #fff;
            border-radius: 10px;
            padding: 20px;
            font-size: 150%;
        }

        .vox .vox {
            background-color: #ccc;
            color: #444;
        }

        .ia {
            grid-column: 1 / 3;
        }

        .ib {
            grid-column: 4;
        }

        .ic {
            grid-column: 1;
            grid-row: 2 / 4;
        }

        .id {
            grid-column: 2 / 5;
            grid-row: 2 / 4;
            display: grid;
            grid-template-columns: subgrid;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="box a">A</div>
        <div class="box b">B</div>
        <div class="box c">C</div>
        <div class="box d">
            <div class="box e">E</div>
            <div class="box f">F</div>
            <div class="box g">G</div>
        </div>
    </div>

    <br>
    <hr>
    <div class="container">
        <div class="vox ia">A</div>
        <div class="vox ib">B</div>
        <div class="vox ic">C</div>
        <div class="vox id">
            <div class="vox ie">E</div>
            <div class="vox if">F</div>
            <div class="vox ig">G</div>
            <div class="vox ih">H</div>
            <div class="vox ii">I</div>
            <div class="vox ij">J</div>
            <div class="vox ik">K</div>
        </div>
    </div>

</body>

</html>
