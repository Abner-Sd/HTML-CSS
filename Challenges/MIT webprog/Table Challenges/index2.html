<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Challenges</title>
    <style>
        body {
            background-color: grey;
        }



        th,
        td {
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!--  <h2>Table 1</h2>
    <img src="img/table 1.png" alt="Desafio 1" height="400px" width="400px"> -->
    <br>
    <table>
        <tr>
            <td rowspan="3">1</td>
            <td rowspan="2">2</td>
            <td colspan="2">3</td>
            <td rowspan="3">4</td>
            <td colspan="2">5</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
        <tr>
            <td colspan="2">10</td>
            <td>11</td>
            <td>12</td>
            <td rowspan="3">13</td>
        </tr>
        <tr>
            <td>14</td>
            <td colspan="2">15</td>
            <td colspan="3">16</td>
        </tr>

        <tr>
            <td>17</td>
            <td colspan="2">18</td>
            <td rowspan="2">19</td>
            <td colspan="2">20</td>
        </tr>
        <tr>
            <td>21</td>

        </tr>
        <tr>
            <td rowspan="4">24</td>

            <td>26</td>
            <td colspan="3">27</td>

        <tr>
            <td rowspan="3">28</td>
            <td rowspan="3" colspan="3">29</td>
        </tr>
        <tr>
            <td>30</td>
            <td>31</td>
        </tr>

        <tr>
            <td>32</td>
            <td>33</td>
        </tr>
        <tr>
            <td>34</td>
            <td colspan="4">35</td>
            <td>36</td>
            <td rowspan="2">37</td>
        </tr>

        <tr>
            <td colspan="3">38</td>
            <td>39</td>
            <td rowspan="2">40</td>
            <td rowspan="2">41</td>
        </tr>

        <tr>
            <td rowspan="5" colspan="3">42</td>
            <td>43</td>
            <td>44</td>
        </tr>
        <tr>
            <td>45</td>
            <td>46</td>
            <td>47</td>
            <td>48</td>
        </tr>
        <tr>
            <td>49</td>
            <td>50</td>
            <td colspan="2" rowspan="2">60</td>
        </tr>
        <tr>
            <td colspan="2" rowspan="3">61</td>
            
        </tr>
        <tr>
            <td colspan="2">62</td>
        </tr>
        <tr>
            <td>63</td>
            <td colspan="2">64</td>
            <td colspan="2">65</td>
        </tr>
    </table>

</body>

</html>
