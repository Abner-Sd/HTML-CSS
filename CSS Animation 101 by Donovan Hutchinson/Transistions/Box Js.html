<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add or remove class</title>
</head>

<style>
    /* Transition */
    div {
        transition: all 0.5s cubic-bezier(.83, -0.43, .21, 1.42);
    }

    /* Text states (for js) */
    .hide {
        opacity: 0;
        top: calc(50% + 8em);
    }

    .show {
        opacity: 1;
        top: calc(50% + 6em);
    }

    /* General styles */
    body {
        background-color: #134;
        transition: background 0.5s ease-out;
        font-family: HelveticaNeue, Arial, Sans-serif;
    }

    body.on {
        background-color: #099;
    }

    button {
        background: transparent;
        border: 2px solid #fff;
        border-radius: 1em;
        color: #fff;
        cursor: pointer;
        font-size: 24px;
        padding: 1em 2em;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate3d(-50%, -50%, 1em);
        transition: all 0.4s ease-out;
    }

    button:hover,
    button.active {
        background: white;
        color: #099;
        outline: none;
    }

    button:focus {
        outline: none;
    }

    div {
        color: #fff;
        text-align: center;
        position: absolute;
        left: 50%;
        top: (50% + 4em);
        transform: translate(-50%, -50%);
    }
</style>

<script>
    document.getElementById('show-element').onclick = function () {
        var element = document.getElementById('to-show');
        if (element.className === 'hide') {
            element.className = 'show';
            document.getElementsByTagName('body')[0].className = 'on';
            document.getElementById('show-element').className = 'active';
        } else {
            element.className = 'hide';
            document.getElementsByTagName('body')[0].className = 'off';
            document.getElementById('show-element').className = '';
        }
    }
</script>

<body>
    <button id="show-element">Show it</button>
    <div id="to-show" class="hide">
        <h1>Some hidden content</h1>
        <p>Pressing the button shows this content. Nice!</p>
    </div>
</body>

</html>
