<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários2</title>
    <style>
        body {
            background-color: grey;
        }
    </style>
</head>
<body>
   <form action="get">
<p>
    <label for="in1">Número 1: </label>
    <input type="number" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
</p>
<p>
    <label for="in2">Número 2: </label>
    <input type="number" id="in2" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
</p>

<p>
    <label for="isoma">Soma: </label>
<output id="isoma">0</output>
</p>
   </form>

   <hr>
   <br>
   <form action="get">
    <label for="inum">Número: </label>
    <input type="range" id="inum" oninput="ival.innerHTML = Number(inum.value)">
    <output id="ival">100</output>
   </form>

   <hr><br>

   <form action="cadastro. php" method="get" autocomplete="on">

<p>

<label for="iano">Em que ano você nasceu? </label>
<input type="number" name="ano" id="iano" min="1900" max="2020"
oninput="calcIdade()">
</p>

<p>

<label for="iidade">Sua idade é: </label>
<output id="iidade">0</output>
</p>

<p>

<input type="submit" value="Enviar">
<input type="reset" value="Limpar">
</p>
</form>

<script>
function calcIdade() {
let atual = new Date().getFullYear()
iidade.innerHTML = Number(atual) - Number(iano.value)
}
</script>
    
</body>
</html>
