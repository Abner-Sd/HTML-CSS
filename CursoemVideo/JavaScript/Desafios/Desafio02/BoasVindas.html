<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas Vindas</title>
    <style>
        body {
            background-color: grey;
        }

        input{
            background-color: whitesmoke;
            padding: 20px;
            font-size: 20px;
            border-radius: 5xp;
        }
    </style>
</head>
<body>
<h1>Boas-Vindas</h1>
<input type="button" value="Inicie o desafio" onclick="desafio()">

<script>
function desafio(){
    let nome = prompt("Qual o seu nome?", string);
    let idade = prompt(`Olá. ${nome}! Quantos anos você tem?`)

    window.alert(`Acabei de conhecer ${nome}, que tem ${idade} anos de idade`)

}
</script>
</body>
