<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        body {
            background-color: grey;
        }

        div.container {
            border: 3px solid blue;

            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);


            grid-auto-rows: 80px;
            grid-auto-flow: row;
        }



        div.item {
            border: 3px solid rgb(0, 0, 0);
            padding: 5px;
            background-color: bisque;
        }

        #a {
            grid-column: 1 / -1;

        }

        #b {
          /*   grid-row: 2 / span 2;
            grid-column: 1 / span 2; */
/* grid-area: gr-star / gc-start / gr-end / gc-end */
            grid-area: 2  / 1 / span 2 / span 2;
        }

        #c {
            grid-row: 2 / span 2;
            grid-column: 3 / span 2;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>


    </div>
</body>

</html>
