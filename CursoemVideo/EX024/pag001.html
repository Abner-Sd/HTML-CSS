<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site teste</title>
    <style>
        body{
            background-color: rgb(65, 39, 39);
            color: white;
        }

        table{

        }

            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

       </tr>

<tbody>
<tr>

</tr>
<tr>

</tr>

<tr>

</tr>
<tr>
    <td style="background-color: orange;">11:00am</td>
    <td style="background-color: green;">2:00pm</td>

</tr>
<tr>
    <td style="background-color: green;">2:00pm</td>

<tr>

</tr>
</tbody>
</table>

</html>
