<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
       *{
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
       }
       
       body {
            background-color: grey;
        }

        main{
            background-color: antiquewhite;
            height: 100vh;
            width: 100vw;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: aquamarine;
            height: 200px;
            width: 200px;
            text-align: center;
          
        }

        
       
    </style>
</head>

<body>
  <main>
    <section>
        <h1>Tela Login</h1>
    </section>
  </main>
</body>

</html>
