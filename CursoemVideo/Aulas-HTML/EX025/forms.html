<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        body {
            background-color: grey;
        }
    </style>
</head>

<body>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p><label for="iname">Nome: </label>
            <input type="text" name="nome" id="iname" placeholder="Primeiro nome" required>
        </p>
        <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome"
                placeholder="Segundo nome" required></p>
        <p>
            <label for="isen"> Senha: </label>
            <input type="password" name="sen" id="isen" placeholder="*************" required>
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    <br>
    <hr><br>

    <form action="get" autocomplete="on">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo"
                autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" value="5" step="0.5">
        </p>

        <p>
            <label for="idia">Dia da Prove</label>
            <input type="date" name="dia" id="idia" value="2026-06-09">
        </p>

        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora">
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" value="2026-06">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>

    <br>
    <hr><br>

    <form action="get">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="imail">E-mail: </label>
                <input type="email" name="mail" id="imail" required>
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="telefone" id="itel" autocomplete="tel" pattern="^[0-9]{4}-[0-9]{4}$">
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>

    <form action="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas"><label for="isxmas">Masc</label>
            <input type="radio" name="sexo" id="isxfem"><label for="isfem">Fem</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favorits</legend>
            <input type="checkbox" id="iesbas"> <label for="iesbas">Basquete</label>
            <input type="checkbox" id="iesfut"> <label for="iesfut">Futebol</label>
            <input type="checkbox" id="iesvol"> <label for="iesvol">Vôlei</label>
        </fieldset>
    </form>
    <br>
    <form action="get">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" id="icor" value="#00ff00">
        </p>
        <p>
            <label for="inivel">Nível de satisfação: </label>
            <input type="range" id="inivel" min="1" max="100" step="5">
        </p>

<p>
    <label for="ifoto">Foto de perfil:</label>
    <input type="file" id="ifoto">
  <!--   se usar o médoto de escolher arquivo, use o action post -->
</p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <br>
    <form action="get">
       <p>
        <label for="iest">Estado: </label>
        <select name="estado" id="iest">
            <option value="" selected>Escolha seu estado</option>
            <optgroup label="Região Sudeste">
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
            </optgroup>

            <optgroup label="Região Nordeste">
                <option value="MA">Maranhão</option>
                <option value="PE"> Pernanbuco</option>
                <option value="RN">Rio Grande do Sul</option>
            </optgroup>
        </select>
       </p> 
       <p>
        <label for="iprof">Profissão</label>
        <input type="text" id="iprof" list="lstprof">
        <datalist id="lstprof">
            <option>Administrador</option>
            <option>Contabilidade</option>
            <option>Desenvolvedor</option>
            <option>Professor</option>
        </datalist>
       </p>
       <p><label for="imsg">Menssagem</label><br>
    <textarea name="msg" id="imsg" cols="10" rows="10" placeholder="Sua mensagem"></textarea></p>
    </form>
</body>

</html>
