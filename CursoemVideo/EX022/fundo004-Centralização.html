<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização</title>
    <style>
        body {
            background-color: grey;
            ;
        }

        #container {
            background-image: url('img/target001.png');
            background-size: 100% 100%;
            position: relative;
            height: 500px;
            background-color: darkblue;
            padding: 10px;
        }

        #conteudo {
            background-image: url('img/target001.png');
            background-size: 100% 100%;

            position: absolute;
            height: 200px;
            width: 400px;
            background-color: rgb(158, 119, 119);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>

</html>
